<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Balance Semanal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212" id="themeColorMeta">
    <style>
        /* Variables de color para cambiar fácilmente entre modos */
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;
            --card-bg: #2d2d2d;
            --input-bg: #333333;
            --input-border: #444444;
            --label-color: #aaaaaa;
            --item-bg: #2d2d2d;
            --date-color: #888888;
            --header-color: #eee;
        }

        .light-mode {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --card-bg: #e8f4f8;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --label-color: #555555;
            --item-bg: #ecf0f1;
            --date-color: #666666;
            --header-color: #333333;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 15px; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .container { 
            max-width: 100%; 
            margin: auto; 
            background: var(--container-bg); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            position: relative;
            transition: background-color 0.3s ease;
        }
        
        /* Botón de tema */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            margin: 0;
            width: auto;
            outline: none;
        }

        h2 { text-align: center; color: #4db8ff; margin-top: 0; font-size: 24px;}
        .card { background: var(--card-bg); padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; border-left: 4px solid #4db8ff; transition: background-color 0.3s ease;}
        .balance { font-size: 32px; font-weight: bold; color: #00e676; margin-top: 5px; }
        .negativo { color: #ff5252; }
        
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; color: var(--label-color); transition: color 0.3s ease;}
        
        input { 
            width: 100%; 
            padding: 12px; 
            margin-top: 5px; 
            border-radius: 8px; 
            border: 1px solid var(--input-border); 
            background: var(--input-bg); 
            color: var(--text-color); 
            box-sizing: border-box; 
            font-size: 16px; 
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        input:focus { outline: none; border-color: #4db8ff; }
        
        button { width: 100%; padding: 14px; margin-top: 20px; border-radius: 8px; border: none; background-color: #4db8ff; color: #121212; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background-color: #3aa3e3; }
        
        .btn-danger { background-color: transparent; border: 1px solid #ff5252; color: #ff5252; margin-top: 30px; }
        .btn-danger:hover { background-color: #331414; }
        
        ul { list-style-type: none; padding: 0; }
        li { background: var(--item-bg); margin-top: 8px; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #ff5252; transition: background-color 0.3s ease;}
        
        .date-text { font-size: 12px; color: var(--date-color); display: block; margin-top: 2px;}
        .item-details { display: flex; flex-direction: column; }
        .monto-text { font-weight: bold; font-size: 16px; }
        h3 { color: var(--header-color); transition: color 0.3s ease; }
    </style>
</head>
<body>

<div class="container">
    <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">⛅</button>
    <h2>Control de Gastos</h2>
    
    <div class="card">
        <label for="ingreso">¿Cuánto te dieron para la semana? ($):</label>
        <input type="number" id="ingreso" placeholder="Ej. 600" onchange="guardarIngreso()" inputmode="decimal">
        <p style="margin-bottom: 0; font-size: 14px; margin-top: 15px; color: var(--label-color);">Balance Disponible:</p>
        <div class="balance" id="balanceText">$0.00</div>
    </div>

    <h3 style="font-size: 18px; margin-bottom: 5px;">Registrar Gasto</h3>
    <label for="concepto">¿En qué gastaste?</label>
    <input type="text" id="concepto" placeholder="Ej. urbano, halcón, gym, materiales...">
    
    <label for="monto">¿Cuánto costó? ($):</label>
    <input type="number" id="monto" placeholder="Ej. 10" inputmode="decimal">
    
    <button onclick="agregarGasto()">Agregar Gasto</button>

    <h3 style="margin-top: 30px; font-size: 18px; margin-bottom: 10px;">Historial de la Semana</h3>
    <ul id="listaGastos"></ul>

    <button class="btn-danger" onclick="limpiarSemana()">Terminar Semana (Borrar historial)</button>
</div>

<script>
    // --- LÓGICA DE MODO CLARO/OSCURO ---
    const themeBtn = document.getElementById('themeToggle');
    const themeMeta = document.getElementById('themeColorMeta');
    let isLightMode = localStorage.getItem('app_theme') === 'light';

    function applyTheme() {
        if (isLightMode) {
            document.body.classList.add('light-mode');
            themeBtn.innerText = '🌙'; // Luna para cambiar a modo oscuro
            themeMeta.setAttribute('content', '#f4f7f6');
        } else {
            document.body.classList.remove('light-mode');
            themeBtn.innerText = '⛅'; // Sol con nube para cambiar a modo claro
            themeMeta.setAttribute('content', '#121212');
        }
    }

    function toggleTheme() {
        isLightMode = !isLightMode;
        localStorage.setItem('app_theme', isLightMode ? 'light' : 'dark');
        applyTheme();
    }
    applyTheme(); // Ejecutar al cargar la página

    // --- LÓGICA DEL SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registrado'))
        .catch(err => console.log('Error en Service Worker', err));
    }

    // --- LÓGICA DE LA APLICACIÓN ---
    let gastos = JSON.parse(localStorage.getItem('misGastos_v3')) || [];
    let ingreso = parseFloat(localStorage.getItem('miIngreso_v3')) || 0;

    document.getElementById('ingreso').value = ingreso || '';

    function guardarIngreso() {
        ingreso = parseFloat(document.getElementById('ingreso').value) || 0;
        localStorage.setItem('miIngreso_v3', ingreso);
        actualizarUI();
    }

    function agregarGasto() {
        let concepto = document.getElementById('concepto').value;
        let monto = parseFloat(document.getElementById('monto').value);

        if(concepto === '' || isNaN(monto) || monto <= 0) {
            alert("Por favor pon un concepto y un costo válido.");
            return;
        }

        let fecha = new Date().toLocaleDateString('es-MX', { weekday: 'short', month: 'short', day: 'numeric' });

        gastos.push({concepto: concepto, monto: monto, fecha: fecha});
        localStorage.setItem('misGastos_v3', JSON.stringify(gastos));

        document.getElementById('concepto').value = '';
        document.getElementById('monto').value = '';
        
        actualizarUI();
    }

    function actualizarUI() {
        let totalGastos = 0;
        let lista = document.getElementById('listaGastos');
        lista.innerHTML = '';

        gastos.forEach((gasto, index) => {
            totalGastos += gasto.monto;
            let li = document.createElement('li');
            li.innerHTML = `
                <div class="item-details">
                    <span>${gasto.concepto}</span>
                    <span class="date-text">${gasto.fecha}</span>
                </div>
                <span class="monto-text">$${gasto.monto.toFixed(2)}</span>
            `;
            lista.appendChild(li);
        });

        let balance = ingreso - totalGastos;
        let balanceEl = document.getElementById('balanceText');
        balanceEl.innerText = `$${balance.toFixed(2)}`;
        
        if(balance < 0) {
            balanceEl.style.color = '#ff5252';
        } else {
            balanceEl.style.color = '#00e676';
        }
    }

    function limpiarSemana() {
        if(confirm("¿Seguro que quieres borrar todo para empezar una nueva semana en blanco?")) {
            gastos = [];
            localStorage.removeItem('misGastos_v3');
            actualizarUI();
        }
    }

    actualizarUI();
</script>
</body>
</html>
